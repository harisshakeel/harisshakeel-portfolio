version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Batch routine bumps into one PR so security advisories stand out on their own.
    groups:
      dev-dependencies:
        dependency-type: "development"
      radix-ui:
        patterns:
          - "@radix-ui/*"
