<svg width="320" height="300" viewBox="0 0 320 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4A3D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF4A3D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Wall plate and arm -->
  <rect x="24" y="44" width="20" height="92" rx="6" fill="#F1EFE8"/>
  <path d="M44 90 H92 L112 112" stroke="#F1EFE8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Camera, tilted down toward the scene -->
  <g transform="rotate(16 170 104)">
    <!-- Field of view -->
    <path d="M262 104 L318 64 L318 150 Z" fill="url(#cone)"/>
    <!-- Sun hood -->
    <rect x="94" y="62" width="176" height="18" rx="9" fill="#D8D3C8"/>
    <!-- Body -->
    <rect x="102" y="74" width="150" height="62" rx="14" fill="#F1EFE8"/>
    <!-- Lens cap -->
    <rect x="244" y="82" width="22" height="46" rx="7" fill="#1A1F26"/>
    <circle cx="255" cy="105" r="8" fill="#FF4A3D"/>
    <!-- Recording light -->
    <circle cx="126" cy="105" r="7" fill="#FF4A3D"/>
    <rect x="144" y="100" width="72" height="10" rx="5" fill="#1A1F26" fill-opacity="0.18"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="258" text-anchor="middle" fill="#F1EFE8"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"
        font-size="40" letter-spacing="8">SENTINEL</text>
</svg>
